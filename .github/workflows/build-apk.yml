name: Build AFRO CITY RP Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract ORIGINAL IP-only launcher ZIP and locate Android project
        run: |
          unzip -q AFRO_CITY_RP_Original_Launcher_IP_Only.zip -d source
          ANDROID_DIR="$(find source -type f -name gradlew -printf '%h\n' | head -n 1)"
          if [ -z "$ANDROID_DIR" ]; then echo "Could not locate Android gradlew in original IP-only ZIP"; exit 1; fi
          PROJECT_DIR="$(dirname "$ANDROID_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Located original Android project: $ANDROID_DIR"

      - name: Install JavaScript dependencies
        run: |
          cd "$PROJECT_DIR"
          if [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build original Android release APK with bundled React Native JavaScript
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"
            if ./gradlew assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 45 seconds before retry (temporary repository rate limits may clear)..."
              sleep 45
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Copy APK to upload folder
        run: |
          mkdir -p artifacts
          cp "$PROJECT_DIR/android/app/build/outputs/apk/release/"*.apk artifacts/
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFRO-CITY-RP-Original-Launcher-IP-Only-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
