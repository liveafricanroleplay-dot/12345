name: Build AFRO CITY RP Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Extract exact uploaded launcher ZIP
        run: |
          unzip -q AFRO_CITY_RP_Launcher_Server_Config.zip -d source
          PROJECT_DIR="$(find source -type f -name package.json -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then echo "Could not locate package.json in uploaded ZIP"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        working-directory: source
        run: |
          cd "$PROJECT_DIR"
          if [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Android debug APK
        working-directory: source
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFRO-CITY-RP-Launcher-APK
          path: source/**/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
